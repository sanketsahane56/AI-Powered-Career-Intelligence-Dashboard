name: 🐛 Bug Report
description: Create a report to help us improve CareerIQ
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      description: e.g., Windows 11, Ubuntu 22.04 / Python 3.10.12
      placeholder: Windows 11 / Python 3.10
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps led to the issue?
      placeholder: |
        1. Go to '/scanner'
        2. Upload sample PDF
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
