name: 💡 Feature Request
description: Suggest an idea or enhancement for CareerIQ
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CareerIQ better? Let us know below!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or workflow?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any other ideas, mockups, or workflows considered?
    validations:
      required: false
