version: '3.8'

services:
  careeriq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careeriq-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - careeriq_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  careeriq_data:
    driver: local
